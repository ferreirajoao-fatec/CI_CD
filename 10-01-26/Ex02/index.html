<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada com While</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="badge">Laço While</div>
        <h1>Tabuada</h1>
        <p class="subtitulo">Informe um número de 1 a 10 para calcular a tabuada.</p>

        <form action="tabuada.php" method="post">
            <div class="campo">
                <label for="numero">Número:</label>
                <input type="number" id="numero" name="numero" min="1" max="10" placeholder="Ex: 7" required>
            </div>

            <div class="acoes">
                <button type="reset" class="btn btn-secundario">Limpar</button>
                <button type="submit" class="btn btn-primario">Calcular</button>
            </div>
        </form>
    </div>
</body>
</html>
